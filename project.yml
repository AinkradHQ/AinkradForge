name: AinkradForge
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
    # Xcode's explicit-module scan walks ForgeEditor's dependencies into CodeEdit's C
    # modules (CodeEditTextViewObjC, TreeSitter) and cannot resolve them from this
    # project. With implicit modules, ForgeEditor's `internal import`s keep them out.
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # Must stay AT OR BEHIND the host's pin — the host embeds the one dynamic
    # copy of the SDK, so a plugin built against a NEWER revision links symbols
    # that copy does not define and dies at `Bundle.load()`. This matches the
    # host's pin exactly: the settings-catalog merge, which is what
    # `settingsCatalog(host:)` in Sources/ForgeFeature/PluginApp.swift needs.
    # bdf3b0d: kit chat pieces (diff review, composer), = host 0.31.0's pin.
    # 41cd9d9: markdown pipe tables and block quotes in AinkradMarkdownText (#111).
    # 51655c2: AinkradMenuButton.kitMenuUnderGlass() opt-in (#112, Forge FD20).
    # 966326c: kit parity batches 1+2 (#113, #114) for the Forge/Grimoire mockups.
    # a352acd: kit parity batches 3+4 (#115, #116) for the Forge/Grimoire mockups.
    # dbc2b5e: kit parity batch 5 (#117) for the Forge mockups.
    revision: dbc2b5eb7dce936861e470084b9cde05070d3607
  # The editor engine (CodeEdit forks) behind Forge's own API — see its Package.swift
  # for why it is a local package. Statically linked into the bundle.
  ForgeEditor:
    path: Packages/ForgeEditor
  # Language servers (ChimeHQ LanguageClient) behind Forge's own API — see its Package.swift.
  ForgeLanguage:
    path: Packages/ForgeLanguage
  # The terminal: the same fork and pin as Rune (no reflow on resize).
  SwiftTerm:
    url: https://github.com/AhmedMElhalaby/SwiftTerm
    revision: e44352494333686a5de418f85f7927b81c6a9fbe
targets:
  ForgeFeature:
    type: library.static
    platform: macOS
    sources: [Sources/ForgeFeature]
    dependencies:
      - package: AinkradAppKit
        embed: false
      - package: ForgeEditor
      - package: ForgeLanguage
      - package: SwiftTerm
  ForgePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/ForgePlugin]
    dependencies:
      - target: ForgeFeature
      # AinkradAppKit is the ONLY shared dependency: dynamic + NOT embedded, so
      # the host's copy is used at runtime and protocol casts succeed. Any other
      # runtime dependency must be statically linked (see the template guide,
      # Docs/Reference/ainkradplugintemplate-readme.md in the Ainkrad workspace).
      - package: AinkradAppKit
        embed: false
      # A static library does not carry its package dependencies; the bundle links them.
      - package: ForgeEditor
      - package: ForgeLanguage
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.forge
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ForgePlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lForgeFeature"]
    postBuildScripts:
      # Generate AinkradAPIVersion from the linked SDK rather than
      # trusting the hand-typed value in Info.plist — see the script.
      - script: "\"$SRCROOT/scripts/stamp-api-version.sh\""
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
  ForgeFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/ForgeFeatureTests]
    dependencies:
      - target: ForgeFeature
      - package: AinkradAppKit
      - package: ForgeEditor
      - package: ForgeLanguage
      - package: SwiftTerm
schemes:
  ForgePlugin:
    build: { targets: { ForgePlugin: all, ForgeFeatureTests: [test] } }
    test: { config: Debug, targets: [ForgeFeatureTests] }
